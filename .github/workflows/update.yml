# Daily: read the Spotify for Creators feed, add new episodes, cache new
# artwork and transcripts (including late transcripts for older episodes),
# rebuild, and commit only if something changed.
name: Update from the podcast feed
on:
  schedule:
    - cron: "17 9 * * *"   # 5:17 AM Eastern (EDT)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python build.py
      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from the podcast feed"
          git push
          # Pushes made with the workflow token don't always start a Pages build.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
