# Daily: read the Spotify for Creators feed, add new episodes, cache new
# artwork and transcripts (including late transcripts for older episodes),
# rebuild, and commit only if something changed.
#
# Loud on failure: if the feed can't be fetched, looks wrong, or the build
# breaks, the run fails (red X) and GitHub emails Chris. Nothing is committed.
#
# Keepalive: GitHub disables scheduled workflows on public repos after 60 days
# without repository activity. Every run re-enables this workflow through the
# API, which resets that clock without a commit. If that call ever fails, the
# run falls back to committing .github/last-run.txt, at most once every 30 days.
name: Update from the podcast feed
on:
  schedule:
    - cron: "17 9 * * *"   # 5:17 AM EDT / 4:17 AM EST (GitHub cron runs on UTC)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Fetch the feed and build the site
        run: python build.py
      - name: Commit and publish if anything changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          before=$(git rev-parse HEAD)
          git commit -m "Update from the podcast feed"
          git pull --rebase
          git push
          # Pushes made with the workflow token don't always start a Pages build.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null \
            || echo "::warning::Could not request a Pages build; the next push will publish."
          # Tell Bing and the other IndexNow engines about new or edited episodes.
          python3 .github/indexnow.py "$before" "$(git rev-parse HEAD)" \
            || echo "::warning::IndexNow submission failed; pages are still published."
      - name: Keepalive
        if: always()
        run: |
          set -uo pipefail
          if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"; then
            echo "Keepalive: re-enabled update.yml through the API."
            exit 0
          fi
          echo "::warning::Keepalive API call failed; falling back to .github/last-run.txt."
          git pull --rebase -q
          last=$(git log -1 --format=%ct -- .github/last-run.txt 2>/dev/null || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then
            echo "last-run.txt was committed within 30 days; nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "Keepalive: last run $(cat .github/last-run.txt)"
          git push
