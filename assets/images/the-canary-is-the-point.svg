<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>
  <!-- mine timbers -->
  <rect x="110" y="150" width="86" height="940" fill="#111111"/>
  <rect x="1004" y="150" width="86" height="940" fill="#111111"/>
  <rect x="80" y="120" width="1040" height="92" fill="#111111"/>
  <line x1="196" y1="212" x2="330" y2="420" stroke="#111111" stroke-width="34"/>
  <line x1="1004" y1="212" x2="870" y2="420" stroke="#111111" stroke-width="34"/>
  <!-- chain from beam to cage -->
  <line x1="600" y1="212" x2="600" y2="300" stroke="#111111" stroke-width="16"/>
  <circle cx="600" cy="322" r="26" fill="none" stroke="#111111" stroke-width="14"/>
  <line x1="600" y1="348" x2="600" y2="392" stroke="#111111" stroke-width="14"/>
  <!-- cage dome and bars -->
  <path d="M 392 470 Q 600 300 808 470" fill="none" stroke="#111111" stroke-width="18"/>
  <line x1="392" y1="470" x2="392" y2="838" stroke="#111111" stroke-width="15"/>
  <line x1="462" y1="428" x2="462" y2="838" stroke="#111111" stroke-width="13"/>
  <line x1="531" y1="404" x2="531" y2="838" stroke="#111111" stroke-width="13"/>
  <line x1="600" y1="396" x2="600" y2="838" stroke="#111111" stroke-width="13"/>
  <line x1="669" y1="404" x2="669" y2="838" stroke="#111111" stroke-width="13"/>
  <line x1="738" y1="428" x2="738" y2="838" stroke="#111111" stroke-width="13"/>
  <line x1="808" y1="470" x2="808" y2="838" stroke="#111111" stroke-width="15"/>
  <line x1="380" y1="470" x2="820" y2="470" stroke="#111111" stroke-width="15"/>
  <!-- cage base: cyan band -->
  <rect x="372" y="838" width="456" height="44" fill="#00AEEF" stroke="#111111" stroke-width="10"/>
  <ellipse cx="600" cy="906" rx="180" ry="20" fill="#111111"/>
  <!-- perch -->
  <line x1="440" y1="668" x2="760" y2="668" stroke="#111111" stroke-width="14"/>
  <!-- canary -->
  <polygon points="516,606 428,706 500,668" fill="#FFD500" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="606" cy="572" rx="102" ry="76" fill="#FFD500" stroke="#111111" stroke-width="11"/>
  <circle cx="700" cy="496" r="52" fill="#FFD500" stroke="#111111" stroke-width="11"/>
  <polygon points="748,482 806,500 748,516" fill="#111111"/>
  <circle cx="712" cy="486" r="8" fill="#111111"/>
  <ellipse cx="582" cy="580" rx="58" ry="33" transform="rotate(-18 582 580)" fill="#EC008C" stroke="#111111" stroke-width="8"/>
  <line x1="586" y1="640" x2="586" y2="668" stroke="#111111" stroke-width="9"/>
  <line x1="624" y1="640" x2="624" y2="668" stroke="#111111" stroke-width="9"/>
  <!-- magenta gas wisps rising from the coal -->
  <path d="M 268 1010 q 26 -48 0 -88 q -26 -40 0 -84" fill="none" stroke="#EC008C" stroke-width="13" stroke-linecap="round"/>
  <path d="M 940 1022 q -24 -44 0 -80 q 24 -38 0 -78" fill="none" stroke="#EC008C" stroke-width="13" stroke-linecap="round"/>
  <!-- floor and coal lumps -->
  <line x1="60" y1="1090" x2="1140" y2="1090" stroke="#111111" stroke-width="18"/>
  <ellipse cx="330" cy="1072" rx="86" ry="26" fill="#111111"/>
  <ellipse cx="600" cy="1078" rx="110" ry="24" fill="#111111"/>
  <ellipse cx="884" cy="1072" rx="80" ry="26" fill="#111111"/>
</svg>
